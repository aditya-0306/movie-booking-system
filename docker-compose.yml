services:
  api:
    build: .
    container_name: movie_booking_api
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./app:/code/app

  db:
    image: postgres:16-alpine
    container_name: movie_booking_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: movie_booking_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: movie_booking_redis
    restart: always
    ports:
      - "6380:6379"

volumes:
  postgres_data:
